name: Linux

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compile matrix
        run: |
          set -euxo pipefail
          cargo check --all-features
          cargo check
          cargo check --no-default-features
