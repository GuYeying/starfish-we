name: Linux

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    # The Wayland-only Linux backend: full compile matrix, the test
    # suite (platform smokes skip without their platform) and a REAL
    # Wayland smoke run under a headless Weston compositor, plus the
    # wasm cross-check.
    # 仅 Wayland 的 Linux 后端：完整编译矩阵、测试套件（缺平台的冒烟
    # 自动跳过）、headless Weston 合成器下的**真实** Wayland 冒烟，以及
    # wasm 交叉检查。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2

      - name: Install build deps for the Linux backend
        # xkbcommon is a C link dep of sctk — pkg-config probes it at
        # BUILD time (even `cargo check`), so it must exist before any
        # compile step. weston is the headless compositor the smoke step
        # runs under.
        # xkbcommon 是 sctk 的 C 链接依赖——pkg-config 在**构建期**探测
        # （连 `cargo check` 都要），必须先于一切编译步骤装好。weston 是
        # 冒烟步骤使用的 headless 合成器。
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev pkg-config weston

      - name: Compile matrix (all / default / no-default features)
        run: |
          set -euxo pipefail
          cargo check --all-features
          cargo check
          cargo check --no-default-features

      # Step names must not contain a bare `: ` — a colon+space inside a
      # plain YAML scalar is a parse error ("workflow file issue", run
      # with zero jobs). Quoted here on purpose.
      # 步骤名不能含裸 `: `——纯量内的冒号+空格是 YAML 解析错误
      # （"workflow file issue"、run 零 job）。这里特意加引号。
      - name: "Test suite (unit tests + platform smokes with skip gates)"
        # Platform smokes without their platform skip gracefully (iOS
        # prints "skipped"); wayland_smoke skip-gates on the missing
        # compositor — the dedicated Weston step below runs it for real.
        # 平台冒烟在无平台时优雅跳过（iOS 打印 "skipped"）；wayland_smoke
        # 因缺合成器而跳过——下方专门的 Weston 步骤会真实运行它。
        run: cargo test --release --no-fail-fast

      - name: Wayland smoke under headless Weston
        # The real backend verification: connect → map → configure → shm
        # commit → events, all inside one bounded step (weston in the
        # background, socket wait loop, timeout-wrapped test run).
        # 真实后端验证：连接 → 映射 → configure → shm 提交 → 事件，全部
        # 在单个有界步骤内（后台 weston、socket 等待循环、timeout 包裹）。
        run: |
          set -euxo pipefail
          export XDG_RUNTIME_DIR=/tmp/xdg-runtime
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=starfish-ci \
            --width=800 --height=600 >weston.log 2>&1 &
          for i in $(seq 1 100); do
            [ -S "$XDG_RUNTIME_DIR/starfish-ci" ] && break
            sleep 0.2
          done
          if [ ! -S "$XDG_RUNTIME_DIR/starfish-ci" ]; then
            echo "=== weston.log ==="
            cat weston.log
            echo "weston failed to create its socket / weston 未能创建 socket"
            exit 1
          fi
          WAYLAND_DISPLAY=starfish-ci timeout 300 \
            cargo test --release --test wayland_smoke -- --nocapture

      - name: Web target cross-check
        run: cargo check --target wasm32-unknown-unknown --all-features
