name: macOS / iOS

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    # Probes the runner's WindowServer and runs the full test suite on a
    # real (virtual) Mac with a GUI session.
    # 探测 runner 的 WindowServer，并在带 GUI 会话的真实（虚拟）Mac 上
    # 跑完整测试套件。
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,aarch64-apple-ios-sim

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2

      - name: Host compile matrix (macOS + iOS sim targets)
        run: |
          set -euxo pipefail
          cargo check --all-features
          cargo check --target aarch64-apple-darwin --all-features
          cargo check --target aarch64-apple-ios-sim --all-features

      - name: WindowServer probe (real NSApplication + NSWindow)
        # --test-threads=1: libtest then runs tests inline on the MAIN
        # thread — required for MainThreadMarker (AppKit is main-thread
        # only; the default multi-thread harness broke the probe).
        # --test-threads=1：libtest 会在主线程内联执行测试——
        # MainThreadMarker 需要（AppKit 仅限主线程；默认多线程 harness
        # 会让探针拿不到标记）。
        run: cargo test --release --test macos_probe -- --test-threads=1 --nocapture

      - name: Full test suite
        # --no-fail-fast: one failing target must not mask the others.
        # --no-fail-fast：单个失败不得掩盖其余目标的结果。
        run: cargo test --release --no-fail-fast

      - name: Upload probe screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-window-probe
          path: target/probe*.png
          if-no-files-found: ignore

  ios-sim:
    # Runs the iOS smoke test inside a booted iPhone simulator:
    # window creation via the UIKit backend + injected-event verification.
    # 在已启动的 iPhone 模拟器内运行 iOS 冒烟测试：
    # 经 UIKit 后端建窗 + 注入事件验证。
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2

      - name: Compile check for iOS simulator
        run: cargo check --target aarch64-apple-ios-sim --all-features

      - name: Build smoke binary
        run: cargo build --release --target aarch64-apple-ios-sim --test ios_sim_smoke

      - name: Boot an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available | awk '/-- iOS/{f=1;next} f&&/ \(/ {print; exit}' | grep -oE '[A-F0-9]{8}-([A-F0-9]{4}-){3}[A-F0-9]{12}' | head -1)
          echo "Booting simulator UDID: $UDID"
          xcrun simctl boot "$UDID"
          # Wait until the simulator fully boots before spawning anything.
          # 等模拟器完全启动后再执行任何 spawn。
          xcrun simctl bootstatus "$UDID" -b
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Run smoke inside the simulator
        run: |
          BIN=$(ls -t target/aarch64-apple-ios-sim/release/deps/ios_sim_smoke-* | grep -v '\.d$' | head -1)
          echo "Running: $BIN"
          set -o pipefail
          xcrun simctl spawn "$SIM_UDID" "$BIN" 2>&1 | tee sim_out.txt
          # Dump captured output even on failure for diagnosis.
          # 失败时也输出捕获内容便于诊断。
          cat sim_out.txt
          grep -q "iOS smoke OK" sim_out.txt
