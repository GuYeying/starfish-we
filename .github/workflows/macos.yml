name: macOS / iOS

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    # Probes the runner's WindowServer and runs the full test suite on a
    # real (virtual) Mac with a GUI session.
    # 探测 runner 的 WindowServer，并在带 GUI 会话的真实（虚拟）Mac 上
    # 跑完整测试套件。
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,aarch64-apple-ios-sim

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2

      - name: Host compile matrix (macOS + iOS sim targets)
        run: |
          set -euxo pipefail
          cargo check --all-features
          cargo check --target aarch64-apple-darwin --all-features
          cargo check --target aarch64-apple-ios-sim --all-features

      - name: WindowServer probe (real NSApplication + NSWindow)
        # --test-threads=1: libtest then runs tests inline on the MAIN
        # thread — required for MainThreadMarker (AppKit is main-thread
        # only; the default multi-thread harness broke the probe).
        # --test-threads=1：libtest 会在主线程内联执行测试——
        # MainThreadMarker 需要（AppKit 仅限主线程；默认多线程 harness
        # 会让探针拿不到标记）。
        run: cargo test --release --test macos_probe -- --test-threads=1 --nocapture

      - name: Full test suite
        # --no-fail-fast: one failing target must not mask the others.
        # --no-fail-fast：单个失败不得掩盖其余目标的结果。
        run: cargo test --release --no-fail-fast

      - name: Upload probe screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-window-probe
          path: target/probe*.png
          if-no-files-found: ignore

  ios-sim:
    # Runs the iOS smoke test inside a booted iPhone simulator:
    # window creation via the UIKit backend + injected-event verification.
    # 在已启动的 iPhone 模拟器内运行 iOS 冒烟测试：
    # 经 UIKit 后端建窗 + 注入事件验证。
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2

      - name: Compile check for iOS simulator
        run: cargo check --target aarch64-apple-ios-sim --all-features

      - name: Build smoke binary
        run: cargo build --release --target aarch64-apple-ios-sim --test ios_sim_smoke

      - name: Package minimal app bundle
        run: |
          mkdir -p target/ios_smoke.app
          BIN=$(ls -t target/aarch64-apple-ios-sim/release/deps/ios_sim_smoke-* | grep -v '\.d$' | head -1)
          cp "$BIN" target/ios_smoke.app/ios_sim_smoke
          cat > target/ios_smoke.app/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>ios_sim_smoke</string>
            <key>CFBundleIdentifier</key><string>com.starfish.iossmoke</string>
            <key>CFBundleName</key><string>ios_smoke</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>MinimumOSVersion</key><string>13.0</string>
          </dict>
          </plist>
          PLIST

      - name: Boot an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available | awk '/-- iOS/{f=1;next} f&&/ \(/ {print; exit}' | grep -oE '[A-F0-9]{8}-([A-F0-9]{4}-){3}[A-F0-9]{12}' | head -1)
          echo "Booting simulator UDID: $UDID"
          xcrun simctl boot "$UDID"
          # Wait until the simulator fully boots before launching anything.
          # 等模拟器完全启动后再 launch。
          xcrun simctl bootstatus "$UDID" -b

      - name: Install and run smoke inside the simulator
        run: |
          xcrun simctl install booted target/ios_smoke.app
          xcrun simctl launch booted com.starfish.iossmoke
          # Poll the app's data container for the result file (the app
          # self-exits after writing it).
          # 轮询应用数据容器内的结果文件（应用写完即自行退出）。
          RESULT=""
          for i in $(seq 1 90); do
            CONTAINER=$(xcrun simctl get_app_container booted com.starfish.iossmoke data 2>/dev/null || true)
            if [ -n "$CONTAINER" ] && [ -f "$CONTAINER/tmp/result.txt" ]; then
              RESULT="$CONTAINER/tmp/result.txt"
              echo "=== result.txt ==="
              cat "$RESULT"
              break
            fi
            sleep 1
          done
          [ -n "$RESULT" ] && grep -q "^OK" "$RESULT"

      - name: Upload smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-out
          path: |
            sim_out.txt
            target/smoke-result.txt
          if-no-files-found: ignore
